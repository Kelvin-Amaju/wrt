appId: com.orbitqa.desktop
productName: OrbitQA Desktop
asar: true
extraResources:
  - from: tools
    to: android-setup
    filter:
      - setup-android.ps1
      - create-real-device-avd.ps1

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - electron/mandatory-interaction-delay.cjs
  - package.json
  - "!electron/**/*.test.cjs"
  - "!electron/**/__snapshots__/**"

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: "OrbitQA-Desktop-v${version}-portable.${ext}"
