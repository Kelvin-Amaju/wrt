<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitQA Download</title>
    <style>
      :root {
        --blue-900: #0a3d91;
        --blue-700: #0d5bd4;
        --blue-500: #2d7ff9;
        --blue-100: #eef5ff;
        --white: #ffffff;
        --text: #12304d;
        --muted: #5a6f8d;
        --border: rgba(13, 91, 212, 0.14);
        --shadow: 0 18px 50px rgba(12, 61, 150, 0.12);
        --danger: #c62828;
        --success: #1c9c68;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f7fbff 0%, #edf5ff 100%);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        width: min(100%, 620px);
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 32px 26px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--blue-100);
        color: var(--blue-900);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 22px;
        max-width: 440px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .button-wrap {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .download-btn,
      .secondary-btn,
      .modal-submit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .download-btn {
        min-width: 220px;
        padding: 16px 26px;
        background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
        color: var(--white);
        box-shadow: 0 12px 24px rgba(45, 127, 249, 0.28);
      }

      .secondary-btn,
      .modal-submit {
        padding: 12px 18px;
      }

      .secondary-btn {
        background: #edf4ff;
        color: var(--blue-900);
      }

      .modal-submit {
        background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
        color: var(--white);
      }

      .download-btn:hover,
      .secondary-btn:hover,
      .modal-submit:hover {
        transform: translateY(-1px);
      }

      .pass-panel {
        margin-top: 26px;
        background: #f7fbff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 16px;
        text-align: left;
      }

      .pass-label {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--blue-900);
        text-transform: uppercase;
        font-weight: 700;
      }

      .pass-code {
        display: block;
        padding: 12px 14px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 1.1rem;
        letter-spacing: 0.12em;
        color: var(--blue-900);
        text-align: center;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        font-size: 0.85rem;
        color: var(--muted);
        flex-wrap: wrap;
      }

      .hidden {
        display: none !important;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 19, 35, 0.52);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }

      .modal-card {
        width: min(100%, 420px);
        background: var(--white);
        border-radius: 18px;
        padding: 24px 22px;
        box-shadow: 0 24px 56px rgba(11, 25, 44, 0.25);
      }

      .modal-card h2 {
        margin: 0 0 10px;
        font-size: 1.4rem;
      }

      .modal-card p {
        margin: 0 0 14px;
      }

      .modal-card input {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(13, 91, 212, 0.25);
        font-size: 1rem;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      .message {
        min-height: 20px;
        margin-top: 12px;
        font-size: 0.92rem;
      }

      .message.error { color: var(--danger); }
      .message.success { color: var(--success); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">QAorbit Pass</div>
      <h1>Download OrbitQA</h1>
      <p>
        Secure access is gated by a time-limited QAorbit pass generated for your IP address.
      </p>

      <div class="button-wrap">
        <button id="downloadBtn" class="download-btn">Request Download</button>
        <button id="newPassBtn" class="secondary-btn">Generate New Pass</button>
      </div>

      <div class="pass-panel">
        <p class="pass-label">Download Access</p>
        <span id="passCode" class="pass-code">Secure access requested</span>
        <div class="meta-row">
          <span id="passIp">IP: resolving...</span>
          <span id="passExpiry">Expires: --:--</span>
        </div>
      </div>
    </main>

    <div id="passModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="passModalTitle">
      <div class="modal-card">
        <h2 id="passModalTitle">Enter QAorbit Pass</h2>
        <p>Enter the pass provided to you to unlock the download for this session.</p>
        <input id="passInput" type="text" autocomplete="one-time-code" placeholder="Enter access code" />
        <div id="passMessage" class="message"></div>
        <div class="modal-actions">
          <button id="cancelPassBtn" class="secondary-btn">Cancel</button>
          <button id="submitPassBtn" class="modal-submit">Unlock Download</button>
        </div>
      </div>
    </div>

    <script>
      const FILE_URL = 'https://drive.google.com/uc?export=download&id=1DbpMNahv6x69262IK1-ZxTjX7jjfSzy3';
      const PASS_API = './pass.php';

      const state = {
        ip: 'unknown',
        pass: '',
        expiresAt: 0,
      };

      const passCodeEl = document.getElementById('passCode');
      const passIpEl = document.getElementById('passIp');
      const passExpiryEl = document.getElementById('passExpiry');
      const passModal = document.getElementById('passModal');
      const passInput = document.getElementById('passInput');
      const passMessage = document.getElementById('passMessage');

      function setMessage(text, type = '') {
        passMessage.textContent = text || '';
        passMessage.className = 'message ' + type;
      }

      function getUnixTime() {
        return Date.now();
      }

      function formatExpiry(msLeft) {
        const totalSeconds = Math.max(0, Math.ceil(msLeft / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      async function getPublicIp() {
        try {
          const response = await fetch('https://api.ipify.org?format=json');
          const data = await response.json();
          return data.ip || 'unknown';
        } catch (error) {
          return 'unknown';
        }
      }

      function renderPass() {
        const expiresIn = Math.max(0, state.expiresAt - getUnixTime());
        passCodeEl.textContent = 'Secure access requested';
        passIpEl.textContent = `IP: ${state.ip}`;
        passExpiryEl.textContent = `Expires: ${formatExpiry(expiresIn)}`;
      }

      async function refreshPass() {
        const ip = state.ip !== 'unknown' ? state.ip : await getPublicIp();
        state.ip = ip;

        const response = await fetch(`${PASS_API}?ip=${encodeURIComponent(ip)}`);
        const data = await response.json();

        if (!data || !data.ok) {
          throw new Error(data && data.message ? data.message : 'Unable to generate pass.');
        }

        state.pass = data.pass;
        state.expiresAt = Number(data.expiresAt) * 1000;
        renderPass();
      }

      function triggerDownload() {
        const link = document.createElement('a');
        link.href = FILE_URL;
        link.target = '_blank';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function openPassModal() {
        setMessage('');
        passInput.value = '';
        passModal.classList.remove('hidden');
        passInput.focus();
      }

      function closePassModal() {
        passModal.classList.add('hidden');
      }

      async function confirmPass() {
        const entered = passInput.value.trim();
        const response = await fetch(PASS_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            ip: state.ip,
            pass: entered,
          }),
        });

        const data = await response.json();

        if (!data || !data.ok) {
          setMessage(data && data.message ? data.message : 'The QAorbit pass is incorrect or expired.', 'error');
          return;
        }

        setMessage('Access approved.', 'success');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('QAorbit download granted', {
            body: `Validated for ${state.ip}`,
          });
        }
        closePassModal();
        triggerDownload();
      }

      async function initializePassManager() {
        state.ip = await getPublicIp();
        try {
          await refreshPass();
        } catch (error) {
          passCodeEl.textContent = 'Pass unavailable';
          passIpEl.textContent = `IP: ${state.ip}`;
          passExpiryEl.textContent = 'Expires: --:--';
          setMessage(error.message, 'error');
        }

        setInterval(() => {
          const expiresIn = state.expiresAt - getUnixTime();
          if (expiresIn <= 0) {
            passExpiryEl.textContent = 'Expires: expired';
            return;
          }
          renderPass();
        }, 1000);
      }

      document.getElementById('downloadBtn').addEventListener('click', async () => {
        try {
          await refreshPass();
        } catch (error) {
          setMessage(error.message, 'error');
        }
        openPassModal();
      });

      document.getElementById('newPassBtn').addEventListener('click', async () => {
        try {
          await refreshPass();
          setMessage('A new QAorbit pass has been generated.', 'success');
          openPassModal();
        } catch (error) {
          setMessage(error.message, 'error');
        }
      });

      document.getElementById('submitPassBtn').addEventListener('click', confirmPass);
      document.getElementById('cancelPassBtn').addEventListener('click', closePassModal);
      passInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          confirmPass();
        }
      });

      if ('Notification' in window) {
        Notification.requestPermission().catch(() => {});
      }

      initializePassManager();
    </script>
  </body>
</html>
